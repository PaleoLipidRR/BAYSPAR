[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayspar"
version = "0.1.0.dev0"
description = "A Bayesian, spatially-varying calibration model for the TEX86 proxy"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ronnakrit Rattanasriampaipong" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# The import package is `baysparpy`, not `bayspar`: brews/baysparpy already
# imports as `bayspar`, and the validation suite installs both. See SPEC.md §2.
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
dev = ["pytest", "threadpoolctl", "matplotlib", "jupyter", "nbformat", "nbclient"]
# notebooks/compare_implementations.ipynb runs against brews/baysparpy when it is
# present and says so when it is not. Kept out of `dev` because it pulls cartopy.
compare = ["baysparpy>=0.0.2"]

# `uv sync` installs this group by default, so one command gives a venv that runs
# the tests and the comparison notebook. It points back at the extras above so the
# lists live in one place; pip users keep `pip install -e ".[dev,compare]"`.
[dependency-groups]
dev = ["bayspar[dev,compare]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["baysparpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
